<svg xmlns="http://www.w3.org/2000/svg" width="960" height="920" viewBox="0 0 960 920">
  <defs>
    <style>
      text { font-family: Roboto, Inter, Arial, sans-serif; }
      .screen { fill: #0f0f0f; stroke: #303030; stroke-width: 1.5; }
      .profile { fill: #2c2c2c; }
      .group { fill: #252525; }
      .row { fill: #212121; }
      .active { fill: #1d1d1d; }
      .white { fill: #f1f1f1; }
      .muted { fill: #aaaaaa; }
      .danger { fill: #ffb4ab; }
      .overline { font-size: 11px; font-weight: 700; letter-spacing: 1.2px; }
      .title { font-size: 22px; font-weight: 700; }
      .name { font-size: 16px; font-weight: 700; }
      .body { font-size: 13px; }
      .small { font-size: 11px; }
    </style>
    <path id="search" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.71.71l.27.28v.78L20 21.49 21.49 20l-5.99-6zm-5 0A4.5 4.5 0 1 1 10.5 5a4.5 4.5 0 0 1 0 9z"/>
    <path id="right" d="M10 6 8.59 7.41 13.17 12l-4.58 4.59L10 18l6-6z"/>
    <path id="check" d="m9 16.17-3.88-3.88-1.41 1.42L9 19 21 7l-1.41-1.41z"/>
    <path id="close" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/>
    <path id="add" d="M19 13h-6v6h-2v-6H5v-2h6V5h2v6h6z"/>
  </defs>
  <rect width="960" height="920" fill="#090909"/>
  <text x="36" y="42" class="white" font-size="22" font-weight="700">FlashTube · Account screen preview</text>
  <text x="36" y="64" class="muted" font-size="12">SonicSpace dimensions and card treatment · FlashTube theme colors and existing icons</text>

  <!-- Settings screen: title, rounded search field, account header card -->
  <text x="38" y="112" class="muted overline">SETTINGS HOME</text>
  <rect x="30" y="130" width="430" height="752" rx="30" class="screen"/>
  <text x="56" y="188" class="white" font-size="32" font-weight="700">Settings</text>
  <rect x="50" y="208" width="390" height="56" rx="28" fill="#2c2c2c"/>
  <use href="#search" x="68" y="224" width="24" height="24" fill="#f1f1f1"/>
  <text x="104" y="243" class="muted body">Search settings</text>

  <rect x="50" y="280" width="390" height="126" rx="28" class="group"/>
  <circle cx="96" cy="337" r="27" fill="#3a3a3a"/>
  <text x="96" y="343" text-anchor="middle" class="white" font-size="17" font-weight="700">A</text>
  <text x="138" y="331" class="white name">Alex Morgan</text>
  <text x="138" y="354" class="muted body">Logged in with YouTube</text>
  <rect x="350" y="325" width="76" height="30" rx="12" fill="#333333"/>
  <text x="368" y="344" class="white small" font-weight="700">Account</text>
  <rect x="50" y="426" width="390" height="204" rx="20" class="group"/>
  <circle cx="78" cy="454" r="18" fill="#3a3a3a"/><text x="78" y="458" text-anchor="middle" class="white small" font-weight="700">A</text>
  <text x="108" y="451" class="white body" font-weight="600">Appearance</text><text x="108" y="469" class="muted small">Theme and display preferences</text><use href="#right" x="408" y="444" width="18" height="18" fill="#aaaaaa"/>
  <circle cx="78" cy="504" r="18" fill="#3a3a3a"/><text x="78" y="508" text-anchor="middle" class="white small" font-weight="700">R</text>
  <text x="108" y="501" class="white body" font-weight="600">Content Region</text><text x="108" y="519" class="muted small">Choose your content region</text><use href="#right" x="408" y="494" width="18" height="18" fill="#aaaaaa"/>
  <circle cx="78" cy="554" r="18" fill="#3a3a3a"/><text x="78" y="558" text-anchor="middle" class="white small" font-weight="700">P</text>
  <text x="108" y="551" class="white body" font-weight="600">Playback</text><text x="108" y="569" class="muted small">Playback quality and controls</text><use href="#right" x="408" y="544" width="18" height="18" fill="#aaaaaa"/>
  <circle cx="78" cy="604" r="18" fill="#3a3a3a"/><text x="78" y="608" text-anchor="middle" class="white small" font-weight="700">S</text>
  <text x="108" y="601" class="white body" font-weight="600">SponsorBlock</text><text x="108" y="619" class="muted small">Skip sponsored video segments</text><use href="#right" x="408" y="594" width="18" height="18" fill="#aaaaaa"/>
  <rect x="50" y="642" width="390" height="62" rx="20" class="group"/>
  <circle cx="78" cy="673" r="18" fill="#3a3a3a"/><text x="78" y="677" text-anchor="middle" class="white small" font-weight="700">D</text>
  <text x="108" y="670" class="white body" font-weight="600">Data &amp; Storage</text><text x="108" y="688" class="muted small">Cache and saved data</text><use href="#right" x="408" y="664" width="18" height="18" fill="#aaaaaa"/>
  <rect x="50" y="716" width="390" height="62" rx="20" class="group"/>
  <circle cx="78" cy="747" r="18" fill="#3a3a3a"/><text x="78" y="751" text-anchor="middle" class="white small" font-weight="700">i</text>
  <text x="108" y="744" class="white body" font-weight="600">About</text><text x="108" y="762" class="muted small">App information and privacy</text><use href="#right" x="408" y="738" width="18" height="18" fill="#aaaaaa"/>

  <!-- Account page -->
  <text x="500" y="112" class="muted overline">ACCOUNT PAGE</text>
  <rect x="490" y="130" width="440" height="752" rx="30" class="screen"/>
  <text x="516" y="185" class="muted" font-size="24">‹</text>
  <text x="554" y="185" class="white title">Accounts</text>
  <text x="516" y="220" class="muted body">Select an account to switch profiles.</text>

  <rect x="514" y="240" width="392" height="132" rx="28" class="profile"/>
  <circle cx="562" cy="286" r="36" fill="#3a3a3a"/>
  <text x="562" y="293" text-anchor="middle" class="white" font-size="20" font-weight="700">A</text>
  <circle cx="589" cy="313" r="12" fill="#f1f1f1"/>
  <use href="#check" x="582" y="306" width="14" height="14" fill="#0f0f0f"/>
  <text x="614" y="280" class="white" font-size="18" font-weight="700">Alex Morgan</text>
  <text x="614" y="303" class="white body">@alexmorgan</text>
  <text x="614" y="330" class="muted small">2 connected accounts</text>

  <text x="518" y="412" class="white" font-size="15" font-weight="700">Saved Accounts</text>
  <rect x="514" y="428" width="392" height="68" rx="16" class="active"/>
  <circle cx="550" cy="462" r="20" fill="#3a3a3a"/>
  <text x="550" y="467" text-anchor="middle" class="white" font-size="13" font-weight="700">A</text>
  <text x="582" y="457" class="white" font-size="14" font-weight="700">Alex Morgan</text>
  <text x="582" y="478" class="muted small">@alexmorgan</text>
  <use href="#check" x="870" y="452" width="20" height="20" fill="#f1f1f1"/>

  <rect x="514" y="506" width="392" height="68" rx="16" class="row"/>
  <circle cx="550" cy="540" r="20" fill="#3a3a3a"/>
  <text x="550" y="545" text-anchor="middle" class="white" font-size="13" font-weight="700">J</text>
  <text x="582" y="535" class="white" font-size="14" font-weight="500">Jamie Lee</text>
  <text x="582" y="556" class="muted small">@jamielee</text>
  <use href="#close" x="870" y="530" width="20" height="20" fill="#aaaaaa"/>

  <rect x="514" y="584" width="392" height="54" rx="16" class="row"/>
  <use href="#add" x="535" y="601" width="20" height="20" fill="#f1f1f1"/>
  <text x="565" y="618" class="white body" font-weight="600">Add another account</text>

  <rect x="514" y="654" width="392" height="62" rx="20" class="group"/>
  <text x="536" y="691" class="danger body" font-weight="600">Sign out of current account</text>
  <use href="#right" x="870" y="675" width="20" height="20" fill="#aaaaaa"/>
  <text x="514" y="754" class="muted small">Rounded cards and surfaces take their colors from</text>
  <text x="514" y="772" class="muted small">FlashTube’s selected light, dark, or OLED theme.</text>
</svg>
